{% extends "index.html" %}

{% block title %}Dettaglio Report Questionario{% endblock %}


{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card shadow-sm h-100 p-3">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Dettaglio Report Questionario ID: {{ id_progetto_questionario }}</h5>
            </div>
            <div class="card-body p-0">
                
                <div id="messageContainer" class="p-3">
                    </div>
                
                <div id="reportContainer">
                    <div class="text-center text-muted p-5" id="loadingMessage">
                        <div class="spinner-border text-primary me-2" role="status"></div>Caricamento dati di dettaglio...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12 text-end">
        <a href="{{ url_for('punteggio.dashboard_questionario_page', id_progetto_questionario=id_progetto_questionario) }}" 
           class="btn btn-info me-2"
           title="Visualizza i grafici del punteggio per questo questionario.">
            <i class="bi bi-graph-up"></i> Visualizza Dashboard
        </a>
        
        <button id="salvaButton" class="btn btn-success me-2" style="display: none;">
            <i class="bi bi-save"></i> Salva Risposte
        </button>
        <button id="concludiButton" class="btn btn-primary me-2" style="display: none;" disabled
                title="Devi rispondere e salvare tutte le domande prima di concludere.">
            <i class="bi bi-check2-circle"></i> Concludi Questionario
        </button>
        <a href="{{ url_for('appBT.report_progetti_questionari_page') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Torna alla Lista
        </a>
    </div>
</div>
{% endblock %} 

{% block scripts %}

<script>
// Variabile globale per tracciare le risposte selezionate (anche quelle non salvate)
let risposteSelezionate = {};
// Variabile globale per tracciare i dati del report (stato salvato dal DB)
let currentReportData = [];

document.addEventListener('DOMContentLoaded', function() {
    const idProgettoQuestionario = "{{ id_progetto_questionario }}";
    
    const salvaButton = document.getElementById('salvaButton');
    const concludiButton = document.getElementById('concludiButton'); 

    if (salvaButton) {
        salvaButton.addEventListener('click', function() {
            salvaRisposteMassive(idProgettoQuestionario); 
        });
    } else {
        console.error("Elemento 'salvaButton' non trovato nel DOM.");
    }
    
    if (concludiButton) {
        concludiButton.addEventListener('click', function() {
            // Prima salva, poi calcola
            salvaRisposteMassive(idProgettoQuestionario, true); 
        });
    } else {
        console.error("Elemento 'concludiButton' non trovato nel DOM.");
    }

    fetchDettaglioReport(idProgettoQuestionario);
});


// ======================================================================
// 0. FUNZIONE DI UTILITY PER MESSAGGI 
// ======================================================================
function displayMessage(message, type = 'success', duration = 5000) {
    const container = document.getElementById('messageContainer');
    if (!container) return; 

    const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
    
    container.innerHTML = ''; 

    const alertDiv = document.createElement('div');
    alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
    alertDiv.setAttribute('role', 'alert');
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    
    container.appendChild(alertDiv);

    setTimeout(() => {
        if (alertDiv) {
            alertDiv.classList.remove('show');
            setTimeout(() => alertDiv.remove(), 150); 
        }
    }, duration); 
}


// ======================================================================
// 1. GESTIONE CARICAMENTO DATI (Ora senza grafico)
// ======================================================================
function fetchDettaglioReport(id) {
    const reportContainer = document.getElementById('reportContainer');
    const loadingMessage = document.getElementById('loadingMessage');
    const salvaButton = document.getElementById('salvaButton'); 
    const concludiButton = document.getElementById('concludiButton');

    // Setup Iniziale della UI
    if (loadingMessage) {
        loadingMessage.style.display = 'block';
    }
    
    if (salvaButton) {
        salvaButton.style.display = 'none'; 
    }
    if (concludiButton) {
        concludiButton.style.display = 'none'; 
        concludiButton.disabled = true; 
    }
    
    reportContainer.innerHTML = ''; 

    const url = `/api/dettaglio_report/${id}`;

    // Chiamata API
    fetch(url)
        .then(response => {
            if (!response.ok) {
                return response.json().then(errorData => {
                    const errorMessage = errorData.error || `Errore HTTP: ${response.status}`;
                    throw new Error(errorMessage);
                });
            }
            return response.json();
        })
        .then(data => {
            risposteSelezionate = {}; 
            currentReportData = data; 
            
            if (loadingMessage) { 
                loadingMessage.style.display = 'none'; 
            }

            if (data && data.length > 0) {
                if (salvaButton) { 
                    salvaButton.style.display = 'inline-block';
                }
                if (concludiButton) { 
                    concludiButton.style.display = 'inline-block';
                }
                renderReport(data); 
                checkCompletionStatus(); 
                
                // ? RIMOZIONE: Eliminata la chiamata fetchAndDrawRadarChart(id);
            } else {
                reportContainer.innerHTML = '<div class="alert alert-info p-5 text-center">Nessuna domanda associata a questo questionario o dati non disponibili.</div>';
            }
        })
        .catch(error => {
            console.error('Errore nel recupero del report:', error);
            if (loadingMessage) loadingMessage.style.display = 'none'; 
            if (salvaButton) salvaButton.style.display = 'none'; 
            if (concludiButton) concludiButton.style.display = 'none'; 
            
            reportContainer.innerHTML = `<div class="alert alert-danger p-5 text-center">
                **Errore nel caricamento dei dati:** ${error.message}. Per favore, riprova.
            </div>`;
        });
}


// ======================================================================
// 2. RENDERING DEI DATI 
// ======================================================================

function handleRispostaChange(radioElement) {
    const idAssociazione = parseInt(radioElement.getAttribute('data-id-associazione'));
    const idRisposta = parseInt(radioElement.value);

    risposteSelezionate[idAssociazione] = idRisposta;

    console.log(`Risposta selezionata: Associazione ID ${idAssociazione}, Risposta ID ${idRisposta}`);
}

function renderReport(data) {
    const container = document.getElementById('reportContainer');
    container.innerHTML = ''; 

    const accordion = document.createElement('div');
    accordion.className = 'accordion';
    accordion.id = 'domandeAccordion';

    data.forEach((domanda, index) => {
        const idAssociazione = domanda.id_associazione; 
        const accordionId = `collapse_${idAssociazione}`;
        const headerId = `heading_${idAssociazione}`;
        const isCollapsed = index === 0 ? '' : 'collapsed'; 
        const isShowing = index === 0 ? 'show' : '';

        const rispostaSalvataId = domanda.risposta_salvata_id; 
        
        if (rispostaSalvataId) {
             risposteSelezionate[idAssociazione] = rispostaSalvataId;
        }

        const item = document.createElement('div');
        item.className = 'accordion-item';

        item.innerHTML = `
            <h2 class="accordion-header" id="${headerId}">
                <button class="accordion-button ${isCollapsed} fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#${accordionId}" aria-expanded="${index === 0 ? 'true' : 'false'}" aria-controls="${accordionId}">
                    Domanda #${index + 1}: ${domanda.testo} 
                    ${rispostaSalvataId ? '<span class="badge bg-success ms-3">Risposta Salvata</span>' : '<span class="badge bg-warning ms-3">Non Risposta</span>'}
                </button>
            </h2>
            <div id="${accordionId}" class="accordion-collapse collapse ${isShowing}" aria-labelledby="${headerId}" data-bs-parent="#domandeAccordion">
                <div class="accordion-body">
                    <h6 class="text-primary mb-3">Seleziona la risposta:</h6>
                </div>
            </div>
        `;
        
        const body = item.querySelector('.accordion-body');
        const risposte = domanda.risposte_possibili;

        if (risposte && risposte.length > 0) {
            const ul = document.createElement('ul');
            ul.className = 'list-group list-group-flush';

            risposte.forEach(risposta => {
                const radioGroupName = `risposta_domanda_${idAssociazione}`;
                const isChecked = risposta.id === rispostaSalvataId ? 'checked' : ''; 

                const li = document.createElement('li');
                li.className = 'list-group-item';
                
                const radioHtml = `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" 
                               name="${radioGroupName}" 
                               id="risposta_${idAssociazione}_${risposta.id}" 
                               value="${risposta.id}" 
                               data-peso="${risposta.peso}"
                               data-id-associazione="${idAssociazione}" 
                               ${isChecked} 
                               onchange="handleRispostaChange(this)">
                        <label class="form-check-label fw-medium" for="risposta_${idAssociazione}_${risposta.id}">
                            ${risposta.descr} 
                            ${risposta.peso !== null ? `(Peso: ${risposta.peso})` : ''}
                        </label>
                    </div>
                `;
                li.innerHTML = radioHtml;
                ul.appendChild(li);
            });
            
            body.appendChild(ul);
        } else {
            body.innerHTML += '<div class="alert alert-warning mb-0">Nessuna risposta possibile definita per questa domanda.</div>';
        }

        accordion.appendChild(item);
    });

    container.appendChild(accordion);
}


// ======================================================================
// 3. GESTIONE INTERAZIONE UTENTE E SALVATAGGIO 
// ======================================================================
function salvaRisposteMassive(idProgettoQuestionario, triggerConcludi = false) {
    const salvaButton = document.getElementById('salvaButton');
    const concludiButton = document.getElementById('concludiButton');
    
    const risposteDaSalvare = [];

    for (const idAssociazione in risposteSelezionate) {
        risposteDaSalvare.push({
            id_progetto_questionario_domanda: parseInt(idAssociazione),
            id_risposta: parseInt(risposteSelezionate[idAssociazione])
        });
    }

    if (risposteDaSalvare.length === 0) {
        displayMessage("Nessuna risposta selezionata da salvare.", 'danger');
        return;
    }

    // Disabilita i pulsanti
    if (salvaButton) { 
        salvaButton.disabled = true;
        salvaButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Salvataggio...';
    }
    if (concludiButton) {
        concludiButton.disabled = true; 
    }


    fetch('/api/risposta_cliente/salva_risposte_massive', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token if csrf_token else "" }}' 
        },
        body: JSON.stringify(risposteDaSalvare)
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(errorData => {
                throw new Error(errorData.error || `Errore HTTP: ${response.status}`);
            });
        }
        return response.json();
    })
    .then(data => {
        // Riabilita il pulsante Salva
        if (salvaButton) {
            salvaButton.disabled = false;
            salvaButton.innerHTML = '<i class="bi bi-save"></i> Salva Risposte';
        }

        if (data.success) {
            displayMessage(`Salvataggio di ${risposteDaSalvare.length} risposte completato con successo! ??`, 'success');
            
            // Ricarica per aggiornare gli indicatori di risposta salvata
            fetchDettaglioReport(idProgettoQuestionario); 
            
            // Se l'utente ha premuto 'Concludi', prosegui con il calcolo del punteggio
            if (triggerConcludi) {
                concludiQuestionario(idProgettoQuestionario);
            }
            
        } else {
            displayMessage('ERRORE: ' + (data.error || 'Si è verificato un errore nel salvataggio.'), 'danger');
            console.error('Errore API:', data.error);
        }
    })
    .catch(error => {
        // Gestione errore di rete/API
        if (salvaButton) {
            salvaButton.disabled = false;
            salvaButton.innerHTML = '<i class="bi bi-save"></i> Salva Risposte';
        }
        if (concludiButton) {
             concludiButton.disabled = false; 
        }

        displayMessage('ERRORE CRITICO: Impossibile comunicare con il server per il salvataggio: ' + error.message, 'danger');
        console.error('Errore di salvataggio:', error);
    });
}

// ======================================================================
// 4. FUNZIONE DI CONTROLLO STATO 
// ======================================================================
function checkCompletionStatus() {
    const concludiButton = document.getElementById('concludiButton');
    
    if (!concludiButton || currentReportData.length === 0) {
        if (concludiButton) {
            concludiButton.disabled = true;
            concludiButton.title = "Nessuna domanda da rispondere.";
        }
        return; 
    }

    const totalDomande = currentReportData.length;
    let answeredDomandeCount = 0;
    
    const allQuestionsSaved = currentReportData.every(domanda => {
        if (domanda.risposta_salvata_id) {
            answeredDomandeCount++;
            return true;
        }
        return false;
    });

    if (allQuestionsSaved) {
        concludiButton.disabled = false; // Abilita
        concludiButton.title = "Questionario completo e risposte salvate. Clicca per concludere e calcolare il punteggio.";
    } else {
        concludiButton.disabled = true; // Disabilita
        concludiButton.title = `Devi salvare le risposte a tutte le domande (${answeredDomandeCount}/${totalDomande} risposte salvate) prima di concludere.`;
    }
}


// ======================================================================
// 5. FUNZIONE: CONCLUDI QUESTIONARIO E CALCOLA PUNTEGGIO (Corretta)
// ======================================================================
function concludiQuestionario(idProgettoQuestionario) {
    const concludiButton = document.getElementById('concludiButton');

    // Disabilita il pulsante "Concludi"
    if (concludiButton) { 
        concludiButton.disabled = true;
        concludiButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Calcolo in corso...';
    }

    const url = `/api/punteggio/calcola/${idProgettoQuestionario}`;

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token if csrf_token else "" }}' 
        }
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(errorData => {
                throw new Error(errorData.error || `Errore HTTP: ${response.status}`);
            });
        }
        return response.json();
    })
    .then(data => {
        // Riabilita il pulsante e aggiorna il testo
        if (concludiButton) {
            concludiButton.disabled = false;
            concludiButton.innerHTML = '<i class="bi bi-check2-circle"></i> Concludi Questionario';
        }

        if (data.success) {
            displayMessage(`? Calcolo punteggio completato! Righe inserite: ${data.risultati.rows_affected}.`, 'success', 8000);
            
            // ? RIMOZIONE: Eliminata la chiamata fetchAndDrawRadarChart(idProgettoQuestionario);
            
        } else {
            displayMessage('ERRORE Calcolo Punteggio: ' + (data.error || 'Si è verificato un errore nel calcolo.'), 'danger');
            console.error('Errore API calcolo punteggio:', data.error);
        }
        checkCompletionStatus(); 
    })
    .catch(error => {
        // Gestione errore di rete/API
        if (concludiButton) {
            concludiButton.disabled = false;
            concludiButton.innerHTML = '<i class="bi bi-check2-circle"></i> Concludi Questionario';
        }
        displayMessage('ERRORE CRITICO: Impossibile comunicare con il server per il calcolo del punteggio: ' + error.message, 'danger');
        console.error('Errore di calcolo punteggio:', error);
        checkCompletionStatus();
    });
}


// ======================================================================
// ? RIMOZIONE: Tutte le funzioni di GESTIONE GRAFICO RADAR sono state rimosse
// ======================================================================
</script>
{% endblock %}
