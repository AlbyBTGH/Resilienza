{% extends "index.html" %}

{% block title %}Dashboard Report Questionario{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 mb-0 text-gray-800"><i class="bi bi-cpu-fill text-primary me-2"></i>Analisi Risultati</h2>
            <p class="text-muted mb-0">Questionario ID: <strong>{{ id_progetto_questionario }}</strong></p>
        </div>
        <a href="{{ url_for('appBT.report_progetti_questionari_page') }}" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left"></i> Torna alla Lista
        </a>
    </div>

    <div class="card shadow border-0 mb-4">
        <div class="card-header bg-white py-3">
            <ul class="nav nav-pills nav-fill" id="radarTab" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active fw-bold" id="baseline-tab" data-bs-toggle="tab" data-bs-target="#baseline" type="button">
                        <i class="bi bi-flag-fill me-2"></i>Punteggio Baseline
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-bold" id="actual-tab" data-bs-toggle="tab" data-bs-target="#actual" type="button">
                        <i class="bi bi-graph-up-arrow me-2"></i>Punteggio Actual
                    </button>
                </li>
            </ul>
        </div>
        
        <div class="card-body bg-light">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="baseline" role="tabpanel">
                    <div class="chart-container bg-white p-4 rounded shadow-sm border" style="position: relative; height: 65vh;">
                        <canvas id="radarChartBaseline"></canvas>
                        <div id="noDataMessageBaseline" class="alert alert-info text-center mt-3" style="display: none;"></div>
                    </div>
                </div>
                <div class="tab-pane fade" id="actual" role="tabpanel">
                    <div class="chart-container bg-white p-4 rounded shadow-sm border" style="position: relative; height: 65vh;">
                        <canvas id="radarChartActual"></canvas>
                        <div id="noDataMessageActual" class="alert alert-info text-center mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const idProgettoQuestionario = {{ id_progetto_questionario }};
    const chartInstances = {};

    function drawRadarChart(canvasId, labels, data, config) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

        chartInstances[canvasId] = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: config.label,
                    data: data,
                    backgroundColor: config.bgColor,
                    borderColor: config.borderColor,
                    borderWidth: 3,
                    pointBackgroundColor: config.borderColor,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        beginAtZero: true,
                        suggestedMax: 100, // <--- Modificato a 100 come nel tuo file copy
                        ticks: { stepSize: 20 }
                    }
                }
            }
        });
    }

    function fetchAndDraw(version) {
        const configs = {
            'Baseline': { id: 'radarChartBaseline', label: 'Baseline', bgColor: 'rgba(54, 162, 235, 0.2)', borderColor: 'rgb(54, 162, 235)', msgId: 'noDataMessageBaseline' },
            'Actual': { id: 'radarChartActual', label: 'Actual', bgColor: 'rgba(75, 192, 192, 0.2)', borderColor: 'rgb(75, 192, 192)', msgId: 'noDataMessageActual' }
        };

        const config = configs[version];
        const msgDiv = document.getElementById(config.msgId);
        const canvas = document.getElementById(config.id);

        // ⭐ FIX: Passiamo 'version' esattamente come definita in configs (Con la MAIUSCOLA)
        const url = `/api/punteggio/grafico_radar/${idProgettoQuestionario}/${version}`;

        msgDiv.style.display = 'block';
        msgDiv.textContent = `Caricamento dati ${version}...`;

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('Status ' + response.status);
                return response.json();
            })
            .then(data => {
                if (data.success && data.data.labels && data.data.labels.length > 0) {
                    msgDiv.style.display = 'none';
                    canvas.style.display = 'block';
                    drawRadarChart(config.id, data.data.labels, data.data.punteggi, config);
                } else {
                    msgDiv.textContent = `Nessun dato trovato per ${version}. Assicurati di aver completato il questionario.`;
                    canvas.style.display = 'none';
                }
            })
            .catch(err => {
                console.error(err);
                msgDiv.textContent = `Errore di connessione o dati non pronti.`;
                canvas.style.display = 'none';
            });
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchAndDraw('Baseline');
        document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', (e) => {
                fetchAndDraw(e.target.id === 'actual-tab' ? 'Actual' : 'Baseline');
            });
        });
    });
</script>
{% endblock %}
