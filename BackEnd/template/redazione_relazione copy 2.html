{% extends "index.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-3">
        <div class="col-12">
            <div class="p-2 border border-info rounded bg-light mb-3 shadow-sm">
                <h5 class="text-primary fw-bold mb-0">Finalizzazione Progetto e Relazione Finale (ID: {{ id_pq }})</h5>
            </div>
        </div>
    </div>

    <form id="formRelazione" action="{{ url_for('relazione.salva_relazione_finale', id_pq=id_pq) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <input type="hidden" id="img_radar_baseline_hidden" name="img_radar_baseline">
        <input type="hidden" id="img_radar_actual_hidden" name="img_radar_actual">

        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h6 class="mb-0">Dati della Relazione</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Sintesi Introduttiva</label>
                                <textarea class="form-control" name="sintesi_introduttiva" rows="3" placeholder="Inserisci una sintesi..."></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Analisi Criticità Iniziali</label>
                                <textarea class="form-control" name="analisi_criticita" rows="3" placeholder="Analisi criticità..."></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Descrizione Interventi</label>
                                <textarea class="form-control" name="descrizione_interventi" rows="3" placeholder="Interventi effettuati..."></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Conclusioni Analista</label>
                                <textarea class="form-control" name="conclusioni_analista" rows="3" placeholder="Conclusioni finali..."></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Firma Analista</label>
                                <input type="text" class="form-control" name="firma_analista" value="{{ current_username }}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h6 class="mb-0">Grafico Radar: Baseline</h6>
                    </div>
                    <div class="card-body">
                        <div style="height: 500px;"> <canvas id="canvasRadarBaseline"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h6 class="mb-0">Grafico Radar: Actual</h6>
                    </div>
                    <div class="card-body">
                        <div style="height: 500px;">
                            <canvas id="canvasRadarActual"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-12 text-end">
                <button type="button" class="btn btn-primary px-5" onclick="salvaEChiudiRelazione()">
                    <i class="fas fa-save me-2"></i>Salva Relazione Finale
                </button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // 1. Configurazione Iniziale
    const idProgettoQuestionario = {{ id_pq }};
    
    // Configurazione stili grafici (coerenti con la tua dashboard)
    const radarConfigs = {
        'Baseline': {
            canvasId: 'canvasRadarBaseline',
            label: 'Punteggio Baseline',
            color: 'rgba(54, 162, 235, 1)',
            bgColor: 'rgba(54, 162, 235, 0.2)'
        },
        'Actual': {
            canvasId: 'canvasRadarActual',
            label: 'Punteggio Actual',
            color: 'rgba(75, 192, 192, 1)',
            bgColor: 'rgba(75, 192, 192, 0.2)'
        }
    };

    /**
     * Funzione per disegnare un singolo radar
     */
    function drawRadarChart(canvasId, labels, data, version) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const config = radarConfigs[version]; 

        // Assicuriamoci che i dati siano numerici (Base 100)
        const numericData = data.map(val => {
            const n = parseFloat(val);
            return isNaN(n) ? 0 : n;
        });

        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: config.label,
                    data: numericData,
                    backgroundColor: config.bgColor,
                    borderColor: config.color,
                    borderWidth: 2,
                    pointBackgroundColor: config.color,
                    pointRadius: 4,
                    fill: true // Riempie l'area del poligono
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    r: {
                        min: 0,
                        max: 100, // <--- SCALA IMPOSTATA A 100
                        beginAtZero: true,
                        angleLines: {
                            display: true,
                            color: 'rgba(0, 0, 0, 0.15)'
                        },
                        grid: {
                            display: true,
                            color: 'rgba(0, 0, 0, 0.1)'
                        },
                        ticks: {
                            stepSize: 20, // Mostra i livelli 0, 20, 40, 60, 80, 100
                            display: true,
                            backdropColor: 'transparent'
                        },
                        pointLabels: {
                            display: true,
                            font: {
                                size: 12,
                                weight: 'bold'
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                }
            }
        });
    }

    /**
     * Funzione che recupera i dati dalle tue API e popola i grafici
     */
    async function inizializzaGraficiRelazione() {
        const idPQ = "{{ id_pq }}";
        
    const fetchAndDraw = async (version, canvasId) => {
        const url = `/api/punteggio/grafico_radar/${idPQ}/${version}`;
        try {
            const response = await fetch(url);
            const res = await response.json();
            
            // LOG FONDAMENTALE: clicca sulla freccetta in console per espandere questo Object!
            console.log(`--- DEBUG COMPLETO ${version} ---`, res);

            // Tentiamo di trovare etichette e valori ovunque siano
            let labels = null;
            let punteggi = null;

            // Caso 1: Struttura standard { success: true, data: { labels: [], punteggi: [] } }
            if (res.data) {
                labels = res.data.labels || res.data.Labels;
                punteggi = res.data.punteggi || res.data.Punteggi || res.data.data;
            } 
            // Caso 2: Struttura piatta { labels: [], punteggi: [] }
            else {
                labels = res.labels || res.Labels;
                punteggi = res.punteggi || res.Punteggi || res.data;
            }

            if (labels && labels.length > 0) {
                drawRadarChart(canvasId, labels, punteggi, version);
            } else {
                console.error(`ERRORE: Non trovo 'labels' in questo oggetto:`, res);
            }
        } catch (error) {
            console.error(`Errore tecnico fetch ${version}:`, error);
        }
    };

        await fetchAndDraw('Baseline', 'canvasRadarBaseline');
        await fetchAndDraw('Actual', 'canvasRadarActual');
    }

    /**
     * Funzione per catturare i canvas e inviare il form
     */
    function salvaEChiudiRelazione() {
        // Recupero i riferimenti ai canvas
        const canvasB = document.getElementById('canvasRadarBaseline');
        const canvasA = document.getElementById('canvasRadarActual');

        if (!canvasB || !canvasA) {
            alert("Errore: Impossibile trovare i grafici radar nella pagina.");
            return;
        }

        // Conversione in Base64 (PNG)
        // Usiamo un piccolo timeout per sicurezza, sebbene animation sia false
        try {
            const base64Baseline = canvasB.toDataURL('image/png');
            const base64Actual = canvasA.toDataURL('image/png');

            // Inserimento nei campi hidden del form
            document.getElementById('img_radar_baseline_hidden').value = base64Baseline;
            document.getElementById('img_radar_actual_hidden').value = base64Actual;

            console.log("Immagini radar catturate. Invio dei dati al server...");
            
            // Invio form
            document.getElementById('formRelazione').submit();
        } catch (e) {
            console.error("Errore durante la cattura dei grafici:", e);
            alert("Si � verificato un errore durante la generazione delle immagini dei grafici.");
        }
    }

    // Avvio al caricamento della pagina
    document.addEventListener('DOMContentLoaded', inizializzaGraficiRelazione);
</script>
{% endblock %}
